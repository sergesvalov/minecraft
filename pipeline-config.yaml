service_name: "minecraft"
stack_type: "docker-compose"
target_cluster: "prod"

# Указываем конкретную директорию для публикации
deploy:
  dir: "/opt/minecraft"


volumes:
  data: "/opt/minecraft/data"

# mylib (dockerComposePipeline) always builds and pushes at least one image; compose itself
# uses itzg/minecraft-server directly, so this one stays as the required minimum.
images:
  - name: "minecraft"
    context: "."

containers:
  - "mc-paper-geyser"
  - "mc-filebrowser"

migrations: false
