version: "3.8"
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-paper-geyser
    # rpi4 has 4 GB RAM and the Jenkins agent runs builds (Gradle/Maven JVMs) on
    # the same host. When memory runs out, the kernel must kill the build, not
    # the game: an OOM kill of the server is a crash without saving the world.
    # 2026-11-05 the server got OOM-killed 3 times in a row and the host hung.
    oom_score_adj: -500
    ports:
      - "25566:25565"          # Java Edition TCP
      - "19132:19132/udp"      # Bedrock Edition UDP
      - "25581:8080"           # Squaremap Web Interface
    environment:
      TZ: "Europe/Athens"
      # Heap only; the JVM's real RSS is ~0.7 GB more. At 2G the server used
      # ~2.7 GB of the 4 GB Pi, leaving too little for builds and the OS.
      MEMORY: "1536M"
      # Tuned G1 GC flags from the itzg image: shorter GC pauses on the Pi
      USE_AIKAR_FLAGS: "true"
      # Defaults are 10/10, too heavy for a Pi 4. Mobs, farms and redstone keep
      # working within 6 chunks of a player; terrain is visible 8 chunks away.
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      EULA: "true"
      TYPE: "PAPER"
      VERSION: "26.3"
      ONLINE_MODE: "false"
      GAMEMODE: "creative"
      DIFFICULTY: "easy"
      MOTD: "Ο διακομιστής του Στεπάν και του Άλεξ"
      OPS: "papa"
      # Run by the image itself once the server is up, one command per line. Superadmin papa:
      # - "op papa" goes through the server, so ops.json gets papa's offline UUID; OPS above can
      #   write the online Mojang UUID, and then papa is not an operator (2026-11-06).
      # - halloumi.tavern and halloumi.inn have "default: false": other ops don't get them, only papa.
      RCON_CMDS_STARTUP: |-
        op papa
        lp user papa permission set halloumi.tavern true
        lp user papa permission set halloumi.inn true
      # Optional Java resource pack with tavern dish icons (resourcepack/). Players may decline it:
      # dishes then look like vanilla food. URL, SHA1 and ID are written by
      # resourcepack/tools/build-packs.mjs; the zip is served from the repo (resourcepack/dist on main).
      RESOURCE_PACK: "https://raw.githubusercontent.com/sergesvalov/minecraft/main/resourcepack/dist/HalloumiPack.zip"
      RESOURCE_PACK_SHA1: "298bd538ee6887bfc528af08771f42642a80ecf8"
      RESOURCE_PACK_ID: "b44afdae-f7b3-4fdf-8ffe-ba9128351354"
      RESOURCE_PACK_ENFORCE: "FALSE"
      RESOURCE_PACK_PROMPT: '{"text":"Иконки блюд таверны «Халуми». Можно отказаться: еда будет обычной."}'
      ENABLE_RCON: "true"
      RCON_PASSWORD: "admin"
      # fastasyncworldedit is temporarily disabled due to download issues and missing 26.3 Modrinth files
      # chunky: world pre-generation (chunk generation is the heaviest load on the Pi)
      MODRINTH_PROJECTS: "authmereloaded,squaremap,luckperms,gsit,axgraves,chunky"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        # https://github.com/IntellectualSites/FastAsyncWorldEdit/releases/latest/download/FastAsyncWorldEdit-Bukkit.jar
    volumes:
      - ./data:/data           # Data will be stored in /opt/minecraft/data on host
    restart: unless-stopped

  # Convenient web interface for downloading mods/plugins and editing configs
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: mc-filebrowser
    user: "1000:1000"          # Matches minecraft file permissions
    ports:
      - "25580:80"             # Web interface will be available on port 25580
    volumes:
      - ./data:/srv            # Expose minecraft directory access
      - filebrowser_db:/database
    environment:
      - TZ=Europe/Athens
      - FB_DATABASE=/database/filebrowser.db
    restart: unless-stopped

  mc-backup:
    image: itzg/mc-backup
    container_name: mc-backup
    environment:
      TZ: "Europe/Athens"
      BACKUP_CRON: "0 2 * * *"
      RCON_HOST: "mc"
      RCON_PASSWORD: "admin"
      BACKUP_METHOD: "restic"
      RESTIC_PASSWORD: "123"
      RESTIC_REPOSITORY: "/backups"
      PRUNE_RESTIC_RETENTION: "--keep-last 7 --keep-daily 7"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    depends_on:
      - mc
    restart: unless-stopped

  warden-monitor:
    build: ./warden-monitor
    container_name: warden-monitor
    environment:
      TZ: "Europe/Athens"
    ports:
      - "8000:8000"
      - "8002:8001"
    volumes:
      - ./data/plugins/WardenLog:/app/logs
      - ./warden-monitor/monitor.py:/app/monitor.py:ro
    depends_on:
      - mc
    restart: unless-stopped

volumes:
  filebrowser_db:
  # Template for vanilla server (can be run in parallel on another port or instead of main if needed)
