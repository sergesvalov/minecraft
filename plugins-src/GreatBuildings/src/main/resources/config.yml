# Великие здания мира.
#
# Здание строится порциями, чтобы сервер не подвисал (20 тиков = 1 секунда).
# Светицховели с оградой — около 750 тысяч ячеек, на Raspberry Pi это примерно минута.

# Сколько блоков ставить за тик
blocks-per-tick: 4000
# Сколько ячеек проверять за тик (большинство уже совпадают — например, воздух над землёй)
checks-per-tick: 30000
