name: HalloumiTrader
version: '${project.version}'
main: com.server.halloumi.HalloumiTraderPlugin
api-version: '1.20'
author: AI
description: Wandering halloumi traders and generated Cypriot taverns.
commands:
  halloumi:
    description: Halloumi trader and tavern commands
    usage: /halloumi <spawn|random|give [amount]|count|taverns|reload|tavern [style]|inn [style]>
permissions:
  halloumi.admin:
    description: Spawn traders, get halloumi, list taverns, reload config
    default: op
  halloumi.tavern:
    # Superadmin only, not given to ops. RCON_CMDS_STARTUP in docker-compose.yml grants it
    # to papa through LuckPerms on every server start.
    description: Build a tavern (two storeys and a yard) in front of you
    default: false
  halloumi.inn:
    # Superadmin only, like halloumi.tavern (granted to papa in RCON_CMDS_STARTUP).
    description: Same as halloumi.tavern (/halloumi inn is an alias of /halloumi tavern)
    default: false
