name: HalloumiTrader
version: '${project.version}'
main: com.server.halloumi.HalloumiTraderPlugin
api-version: '1.20'
author: AI
description: Wandering halloumi traders and generated Cypriot taverns.
commands:
  halloumi:
    description: Halloumi trader and tavern commands
    usage: /halloumi <spawn|random|give [amount]|count|taverns|reload|tavern [style]>
permissions:
  halloumi.admin:
    description: Spawn traders, get halloumi, list taverns, reload config
    default: op
  halloumi.tavern:
    # Superadmin only. Not given to ops by default: the LuckPerms group "admin" has "*",
    # so scripts/auto-perms.sh explicitly denies it there and grants it to papa.
    description: Build a tavern in front of you
    default: false
