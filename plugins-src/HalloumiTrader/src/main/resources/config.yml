# Торговец халуми — странствующий торговец, который продаёт халуми.

trader-name: "Торговец халуми"

# Случайные визиты: раз в check-interval-minutes с вероятностью chance
# торговец появляется рядом со случайным игроком в обычном мире.
random-spawn:
  enabled: true
  check-interval-minutes: 20
  chance: 0.5
  # Не больше стольких торговцев халуми одновременно (в загруженных чанках)
  max-active: 1
  # Расстояние от игрока в блоках
  min-distance: 10
  max-distance: 20

# Через сколько минут торговец уходит (и случайный, и вызванный командой)
despawn-minutes: 30

# %player% — игрок, рядом с которым появился торговец
announce-message: "Торговец халуми пришёл к игроку %player%! Поищи его поблизости."

trade:
  price-emeralds: 2
  # Сколько халуми за одну сделку
  amount: 4
  # Сколько сделок у одного торговца
  max-uses: 16

halloumi:
  name: "Халуми"
  lore:
    - "Жареный кипрский сыр"
  # 8 / 12.8 — как у стейка
  nutrition: 8
  saturation: 12.8

# ---------------------------------------------------------------------------
# Таверны: генерируются сами в новых чанках обычного мира.
# Мир делится на квадраты spacing-chunks x spacing-chunks чанков; в каждом не больше
# одной таверны, и то с шансом chance — если там ровная естественная земля и подходящий биом.
# Стиль постройки зависит от биома (равнины — дуб, тайга — ель, пустыня — песчаник и т.д.).
tavern:
  enabled: true
  worlds: [world]
  # 48 чанков = ~770 блоков: найти сложно, но можно
  spacing-chunks: 48
  chance: 0.6
  # Максимальный перепад высоты под таверной
  max-slope: 3
  # Странствующий торговец халуми подсказывает, где ближайшая таверна
  hints: true
  innkeeper-name: "Трактирщик"
  # Сколько раз можно купить каждое блюдо, потом трактирщик пополняет запасы
  innkeeper-max-uses: 64
  sign:
    - ""
    - "Таверна"
    - "«Халуми»"
    - ""
  # Гости: странствующие торговцы халуми, которые заходят, когда рядом есть игроки
  guests:
    max: 2
    # Шанс за проверку (раз в 10 секунд), если игрок ближе player-radius блоков
    chance: 0.04
    player-radius: 48
  # Гостевой дом рядом с таверной: два этажа (обеденный зал и спальни), двор с мангалом и столиками.
  # Строится, когда чанки вокруг таверны загружены и рядом (к востоку или западу) есть ровная
  # естественная земля без чужих построек; иначе таверна остаётся без дома.
  house:
    enabled: true
    sign:
      - ""
      - "Гостевой дом"
      - "«Халуми»"
      - "Ночлег и мезе"

  # Меню трактирщика (халуми из раздела halloumi идёт первым) и книга на кафедре у входа.
  # item — ванильный предмет, на котором основано блюдо; nutrition/saturation — сколько оно насыщает.
  menu-title: "Меню"
  menu-intro: "Кипрское мезе. Цены в изумрудах, заказ — у трактирщика за стойкой."
  # Версия меню по умолчанию: при её росте новые блюда один раз дописываются в существующий config.yml
  menu-version: 2
  menu:
    - id: souvlaki
      name: "Сувлаки"
      item: cooked_porkchop
      lore: ["Шашлычки из свинины на углях"]
      nutrition: 8
      saturation: 12.8
      price: 3
      amount: 3
    - id: sheftalia
      name: "Шефталья"
      item: cooked_rabbit
      lore: ["Колбаски из фарша с зеленью на углях"]
      nutrition: 6
      saturation: 7.2
      price: 2
      amount: 4
    - id: kleftiko
      name: "Клефтико"
      item: cooked_mutton
