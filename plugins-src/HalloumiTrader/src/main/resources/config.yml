# Торговец халуми — странствующий торговец, который продаёт халуми.

trader-name: "Торговец халуми"

# Случайные визиты: раз в check-interval-minutes с вероятностью chance
# торговец появляется рядом со случайным игроком в обычном мире.
random-spawn:
  enabled: true
  check-interval-minutes: 20
  chance: 0.5
  # Не больше стольких торговцев халуми одновременно (в загруженных чанках)
  max-active: 1
  # Расстояние от игрока в блоках
  min-distance: 10
  max-distance: 20

# Через сколько минут торговец уходит (и случайный, и вызванный командой)
despawn-minutes: 30

# %player% — игрок, рядом с которым появился торговец
announce-message: "Торговец халуми пришёл к игроку %player%! Поищи его поблизости."

trade:
  price-emeralds: 2
  # Сколько халуми за одну сделку
  amount: 4
  # Сколько сделок у одного торговца
  max-uses: 16

halloumi:
  name: "Халуми"
  lore:
    - "Жареный кипрский сыр"
  # 8 / 12.8 — как у стейка
  nutrition: 8
  saturation: 12.8
